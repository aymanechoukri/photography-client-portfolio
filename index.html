<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Oussama Kajja --- Photography & Visual Stories</title>
  </head>
  <body class="bg-mist-950 text-gray-400 font-body">
    <header
      class="w-full px-5 py-5 flex justify-between fixed top-0 left-0 z-50"
    >
      <h1 class="font-serif text-2xl pl-5 before:content-['O'] before:text-4xl">ussama.
      </h1>
      <nav class="flex justify-between w-[45%] pr-5 list-none">
        <li
          class="border-b-2 border-b-transparent p-1 hover:border-b-2 hover:border-b-gray-400 hover:duration-300"
        >
          <a href="#about">ABOUT</a>
        </li>
        <li
          class="border-b-2 border-b-transparent p-1 hover:border-b-2 hover:border-b-gray-400 hover:duration-300"
        >
          <a href="#work">WORK</a>
        </li>
        <li
          class="border-b-2 border-b-transparent p-1 hover:border-b-2 hover:border-b-gray-400 hover:duration-300"
        >
          <a href="#projects">PROJECTS</a>
        </li>
        <li
          class="border-b-2 border-b-transparent p-1 hover:border-b-2 hover:border-b-gray-400 hover:duration-300"
        >
          <a href="#services">SERVICES</a>
        </li>
        <li
          class="border-b-2 border-b-transparent p-1 hover:border-b-2 hover:border-b-gray-400 hover:duration-300"
        >
          <a href="#contact">CONTACT</a>
        </li>
      </nav>
    </header>

    <main class="w-full min-h-screen">
      <section class="w-full bg-img min-h-screen">
        <div class="pt-30 pl-20 font-serif">
          <div>
            <p class="text-amber-300 -tracking-[-0.3em]">PHOTOGRAPHY & VISUAL STORIES.</p>
          </div>

          <div>
            <p class="text-9xl font-serif">Kajja</p>
            <p class="text-9xl pl-40 font-serif">Oussama</p>
          </div>

          <div class="w-[90%] flex justify-around items-center pt-10">
            <p>Fine art photographer capturing quiet moments,<br> honest faces and faraway places across 25+ countries</p>
            <div>
                <button class="bg-black py-4 px-8 rounded-2xl font-extrabold hover:bg-gray-500 hover:text-black active:bg-gray-200 hover:duration-200"><a href="#work">Explore My Work</a></button>
                <button class="border-2 py-3 px-9 rounded-2xl border-black hover:border-gray-500 hover:text-balck hover:duration-200 font-extrabold"><a href="#contact">Contact Me</a></button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
